[package]
name = "jepret-ocr"
description = "Text recognition via Windows.Media.Ocr (offline, built into Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jepret-core.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

[dev-dependencies]
image.workspace = true
