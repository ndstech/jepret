[package]
name = "jepret-settings"
description = "Settings UI (egui) editing config.toml"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jepret-core.workspace = true
jepret-workflow.workspace = true
jepret-ui-theme.workspace = true
anyhow.workspace = true
tracing.workspace = true
eframe.workspace = true
egui.workspace = true
# Native Win32 file dialogs; no extra runtime on Windows.
rfd = { version = "0.15", default-features = false }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
toml.workspace = true
