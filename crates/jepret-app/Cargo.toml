[package]
name = "jepret-app"
description = "Jepret â€” lightweight screen capture for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jepret"
path = "src/main.rs"

[dependencies]
jepret-core.workspace = true
jepret-capture.workspace = true
jepret-overlay.workspace = true
jepret-workflow.workspace = true
jepret-history.workspace = true
jepret-recorder.workspace = true
jepret-scroll.workspace = true
jepret-editor.workspace = true
jepret-gallery.workspace = true
jepret-settings.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Hotkey/tray/IPC memakai Win32 langsung (RegisterHotKey, Shell_NotifyIcon,
# WM_COPYDATA) — lebih ringan daripada global-hotkey + tray-icon + muda.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
