[package]
name = "jepret-editor"
description = "Simple annotation image editor (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jepret-core.workspace = true
jepret-ui-theme.workspace = true
jepret-effects = { path = "../jepret-effects" }
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
eframe.workspace = true
egui.workspace = true
image.workspace = true
arboard.workspace = true
# Text rasterisation in render.rs (pure, no egui). egui already depends on both.
ab_glyph = "0.2"
epaint_default_fonts = "0.29"
# Native Save As dialog (IFileDialog on Windows).
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
tracing-subscriber.workspace = true
