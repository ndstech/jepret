[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/jepret"
rust-version = "1.80"

[workspace.dependencies]
# internal
jepret-core = { path = "crates/jepret-core" }
jepret-capture = { path = "crates/jepret-capture" }
jepret-overlay = { path = "crates/jepret-overlay" }
jepret-workflow = { path = "crates/jepret-workflow" }
jepret-history = { path = "crates/jepret-history" }
jepret-recorder = { path = "crates/jepret-recorder" }
jepret-scroll = { path = "crates/jepret-scroll" }
jepret-editor = { path = "crates/jepret-editor" }
jepret-gallery = { path = "crates/jepret-gallery" }
jepret-settings = { path = "crates/jepret-settings" }

# shared external — pakai `xxx.workspace = true` di crate supaya versi seragam.
# Kalau versi di sini tidak resolve, naikkan di sini (bukan di crate).
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
windows = "0.58"
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
global-hotkey = "0.6"
tray-icon = "0.19"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
